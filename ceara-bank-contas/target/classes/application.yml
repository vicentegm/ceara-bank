server:
  port: ${PORT:8081}

spring:
  application:
    name: ceara-bank-contas
  # Configuração do PostgreSQL
  datasource:
    url: ${DB_URL:jdbc:postgresql://server-cearabank.postgres.database.azure.com:5432/postgres}
    username: ${DB_USERNAME:postgres} 
    password: ${DB_PASSWORD:Unifametro@2026}
    driver-class-name: org.postgresql.Driver
  
  # Configuração JPA/Hibernate
  jpa:
    hibernate:
      ddl-auto: update 
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Configuração do Swagger/OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html 
  api-docs:
    path: /v3/api-docs 

# Configuração do JWT
application:
  security:
    jwt:
      secret-key: NTk1MzkwNGE2ZDc2Mzc2NDdhZWM2MjNiNmY1MzY4Mzc1OTZjNjMzNjU0NjI2MzYzNjE2NDY1Njk3NDcwNzc=
      expiration: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Configuração para o serviço de segurança validar o token
microservicos:
  security:
    url-validacao-token: ${URL_VALIDACAO:http://localhost:8082/v1/seguranca/validarToken}